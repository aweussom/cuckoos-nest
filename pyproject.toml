[project]
name = "cuckoos-nest"
version = "0.1.0"
description = "Claude Code on GitHub Copilot models, through the Copilot SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # Pinned: the bridge leans on external-tool parking, session options and
    # two private modules, validated on exactly this version (STATUS.md).
    # After a bump: run check_tool_order.py and a claude-copilot.ps1 -p run
    # that uses tools.
    "github-copilot-sdk==1.0.30",
    "flask>=3.1",
]

[tool.uv]
# Scripts, not a package: `uv run bridge.py` from the repo root.
package = false
